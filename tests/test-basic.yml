name: Test basic usage with fake token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with fake token (expected to fail gracefully)
        id: action
        uses: .
        continue-on-error: true
        with:
          screenly_api_token: "fake-token-for-testing"
          cli_commands: "screen list"
          print_cli_commands_output: "true"

      - name: Assert action ran and failed gracefully (fake token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESPONSE: ${{ steps.action.outputs.cli_commands_response }}
        run: |
          echo "outcome: $OUTCOME"
          echo "response: $RESPONSE"
          # With a fake token, the CLI should fail authentication.
          # The action is expected to fail (not error/skip).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with a fake API token"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action unexpectedly succeeded (response: $RESPONSE)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
