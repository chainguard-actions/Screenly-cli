name: Test Screenly CLI help command
on:
  workflow_dispatch:
jobs:
  test-help:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Screenly CLI help command with output suppressed
        id: action
        uses: .
        with:
          screenly_api_token: "fake-token"
          cli_commands: "--help"
          print_cli_commands_output: "false"
          cli_version: "v1.1.1"

      - name: Assert cli_commands_response output is set
        env:
          ACTUAL: ${{ steps.action.outputs.cli_commands_response }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected cli_commands_response to be non-empty even with print_cli_commands_output=false"
            exit 1
          fi
          echo "PASS: cli_commands_response is set"

      - name: Assert help output contains expected content
        env:
          ACTUAL: ${{ steps.action.outputs.cli_commands_response }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -qi "screenly\|usage\|help\|command"; then
            echo "PASS: help output contains expected CLI content"
          else
            echo "FAIL: help output does not contain expected CLI content"
            exit 1
          fi
