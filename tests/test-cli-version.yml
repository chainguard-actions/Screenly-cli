name: Test CLI version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          screenly_api_token: "fake-token-for-testing"
          cli_commands: "screen list"
          cli_version: "v26.9.0"

      - name: Assert CLI binary is executable and correct version was downloaded
        run: |
          if [ ! -f /tmp/screenly ]; then
            echo "FAIL: CLI binary not found at /tmp/screenly"
            exit 1
          fi
          if [ ! -x /tmp/screenly ]; then
            echo "FAIL: CLI binary is not executable"
            exit 1
          fi
          echo "PASS: CLI binary exists and is executable"

      - name: Assert action outcome is failure or success (not skipped/cancelled)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran to completion with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' - action may not have run"
            exit 1
          fi
