name: Test Screenly CLI auth failure handling
on:
  workflow_dispatch:
jobs:
  test-auth-failure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Screenly CLI with invalid token and auth-required command
        id: action
        uses: .
        continue-on-error: true
        with:
          screenly_api_token: "invalid-token-12345"
          cli_commands: "asset list"
          print_cli_commands_output: "true"

      - name: Assert action failed due to auth error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid API token"
