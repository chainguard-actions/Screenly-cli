name: Test CLI failure handling
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock wget and failing screenly binary
        run: |
          # Create a fake screenly binary that exits with error
          cat > /tmp/screenly << 'EOF'
          #!/bin/sh
          echo "2024-10-16T13:16:13.974Z DEBUG [reqwest::connect] starting new connection"
          echo "Error: authentication failed"
          exit 1
          EOF
          chmod +x /tmp/screenly

          # Create a fake tar.gz containing the screenly binary
          mkdir -p /tmp/fake-wget-dir
          cp /tmp/screenly /tmp/fake-wget-dir/screenly
          cd /tmp/fake-wget-dir
          tar czf /tmp/fake-screenly.tar.gz screenly

          # Create a fake wget that writes the tar.gz to the -O path
          mkdir -p "$HOME/bin"
          cat > "$HOME/bin/wget" << 'WGETEOF'
          #!/bin/sh
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -O) out="$arg" ;;
            esac
            prev="$arg"
          done
          if [ -n "$out" ]; then
            cp /tmp/fake-screenly.tar.gz "$out"
          else
            cat /tmp/fake-screenly.tar.gz
          fi
          exit 0
          WGETEOF
          chmod +x "$HOME/bin/wget"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Run action and expect failure
        id: action
        uses: .
        continue-on-error: true
        with:
          screenly_api_token: "invalid-token"
          cli_commands: "asset list"
          print_cli_commands_output: "true"

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when CLI exits with non-zero, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when CLI command failed"
