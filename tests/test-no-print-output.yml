name: Test Screenly CLI - suppress output printing
on:
  workflow_dispatch:

jobs:
  test-no-print-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run CLI with print output disabled
        id: action
        uses: .
        with:
          screenly_api_token: "dummy-token"
          cli_commands: "--help"
          print_cli_commands_output: "false"

      - name: Assert output is still captured even when printing is disabled
        env:
          ACTUAL: ${{ steps.action.outputs.cli_commands_response }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected output to be captured even when print_cli_commands_output=false"
            exit 1
          fi
          echo "PASS: output captured correctly with print_cli_commands_output=false"
