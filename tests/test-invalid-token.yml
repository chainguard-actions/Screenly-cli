name: Test invalid token fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid token (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          screenly_api_token: "invalid-token-for-testing"
          cli_commands: "screen list"
          print_cli_commands_output: "true"

      - name: Assert action failed as expected
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token, but got outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid token"

      - name: Assert cli_commands_response output is set (even on failure)
        env:
          ACTUAL: ${{ steps.action.outputs.cli_commands_response }}
        run: |
          echo "cli_commands_response: '$ACTUAL'"
          # The response may be empty or contain an error message - either is acceptable
          # The key assertion is that the output variable exists (even if empty)
          echo "PASS: cli_commands_response output is accessible"
