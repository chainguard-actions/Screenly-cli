name: Test basic usage - help command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          screenly_api_token: "dummy-token-for-help"
          cli_commands: "--help"
          print_cli_commands_output: "true"

      - name: Assert output is captured
        env:
          ACTUAL: ${{ steps.action.outputs.cli_commands_response }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty cli_commands_response output"
            exit 1
          fi
          echo "PASS: cli_commands_response is non-empty"
