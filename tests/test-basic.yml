name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          screenly_api_token: "fake-token-for-testing"
          cli_commands: "screen list"

      - name: Assert action ran and produced output or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESPONSE: ${{ steps.action.outputs.cli_commands_response }}
        run: |
          echo "outcome: $OUTCOME"
          echo "response: $RESPONSE"
          # The CLI will fail with a fake token (auth error), so we expect failure
          # But we want to confirm the action ran (not a setup/download failure)
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with fake token"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert CLI binary was downloaded
        run: |
          if [ ! -f /tmp/screenly ]; then
            echo "FAIL: CLI binary not found at /tmp/screenly"
            exit 1
          fi
          echo "PASS: CLI binary exists at /tmp/screenly"
