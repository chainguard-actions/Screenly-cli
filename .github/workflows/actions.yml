on:
  pull_request:
    branches:
      - master

permissions: {}

jobs:
  test-github-action-workflow:
    runs-on: ubuntu-latest
    name: List screens
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - id: list-screens
        uses: screenly/cli@3d6a92abedc446b3b89e68ea134a33f0025ae564 # master
        with:
          screenly_api_token: ${{ secrets.SCREENLY_API_TOKEN }}
          cli_commands: screen list
