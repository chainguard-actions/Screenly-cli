name: Test CLI auth failure handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action with an invalid token and a command that requires auth.
      # The action uses continue-on-error on the CLI step and then exits 1 on failure,
      # so we use continue-on-error here to capture the failure and assert on it.
      - id: action
        uses: .
        continue-on-error: true
        with:
          screenly_api_token: "invalid-token-12345"
          cli_commands: "asset list"
          print_cli_commands_output: "true"
          cli_version: "v1.1.1"

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid token"
